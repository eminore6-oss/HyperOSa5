
name: Build HYPEROS A5 APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar HYPEROS A5
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Revisar archivos
        run: |
          echo "Carpeta actual:"
          pwd
          echo "Archivos del proyecto:"
          ls -la
          echo "Configuración de Gradle:"
          find . -maxdepth 3 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \)

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HYPEROS-A5-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error


